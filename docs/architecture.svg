<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" role="img" aria-label="standup-gen architecture diagram">
  <title>standup-gen architecture</title>
  <desc>Three layers: a SvelteKit web UI and a standalone CLI, the FastAPI + Postgres backend with a background ingest scheduler, and the external LLM providers and git remotes they talk to.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <style>
      .bg    { fill: #ffffff; }
      .box   { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; rx: 8; }
      .api   { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1.5; rx: 8; }
      .ext   { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.5; rx: 8; }
      .db    { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; rx: 8; }
      .title { fill: #1f2328; font-size: 15px; font-weight: 700; }
      .h     { fill: #1f2328; font-size: 13px; font-weight: 700; }
      .t     { fill: #424a53; font-size: 11.5px; }
      .edge  { stroke: #57606a; stroke-width: 1.5; fill: none; }
      .label { fill: #57606a; font-size: 10.5px; }
      .accent{ fill: #0969da; font-size: 11.5px; font-weight: 700; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="900" height="600"/>
  <text class="title" x="30" y="36">standup-gen — architecture</text>
  <text class="label" x="30" y="54">git commit history → standup summaries (CLI · REST API · web UI)</text>

  <!-- Web UI -->
  <rect class="box" x="40" y="80" width="380" height="92" rx="8"/>
  <text class="h" x="60" y="106">Web UI — SvelteKit SPA</text>
  <text class="t" x="60" y="128">repo management · summary controls · prompt config</text>
  <text class="t" x="60" y="146">streaming cards (SSE) · "copy markdown" · share links</text>
  <text class="label" x="60" y="163">served same-origin by FastAPI (StaticFiles)</text>

  <!-- API -->
  <rect class="api" x="40" y="232" width="380" height="180" rx="8"/>
  <text class="h" x="60" y="258">API — FastAPI (async)</text>
  <text class="t" x="60" y="280">GET /summary · GET /summary/stream (SSE)</text>
  <text class="t" x="60" y="298">/commits · /repos · /providers · /health · /health/deep</text>
  <text class="t" x="60" y="316">/settings/prompt?repo_id · /summaries · /s/{slug}</text>
  <line class="edge" x1="60" y1="330" x2="400" y2="330" stroke-dasharray="3 3"/>
  <text class="accent" x="60" y="352">background scheduler</text>
  <text class="t" x="60" y="370">ingests every registered repo every INGEST_INTERVAL s,</text>
  <text class="t" x="60" y="388">sweeps expired share slugs — /summary stays a pure read</text>

  <!-- Postgres -->
  <rect class="db" x="40" y="472" width="380" height="92" rx="8"/>
  <text class="h" x="60" y="498">Postgres (SQLAlchemy + Alembic)</text>
  <text class="t" x="60" y="520">commits · repos</text>
  <text class="t" x="60" y="538">prompt_settings (per-repo + global) · shared_summaries</text>

  <!-- CLI -->
  <rect class="box" x="500" y="80" width="360" height="120" rx="8"/>
  <text class="h" x="520" y="106">CLI — standup</text>
  <text class="t" x="520" y="128">local path: git log → parse → format_log</text>
  <text class="t" x="520" y="146">--summarize → AI prose summary</text>
  <text class="t" x="520" y="164">--registered &lt;name&gt; → pull from a running API</text>
  <text class="label" x="520" y="182">no database required for the local path</text>

  <!-- LLM providers -->
  <rect class="ext" x="500" y="262" width="360" height="86" rx="8"/>
  <text class="h" x="520" y="288">LLM providers</text>
  <text class="t" x="520" y="310">Anthropic (default) · Groq · DeepSeek</text>
  <text class="label" x="520" y="330">via httpx.AsyncClient · streaming or one-shot</text>

  <!-- git remotes -->
  <rect class="ext" x="500" y="408" width="360" height="80" rx="8"/>
  <text class="h" x="520" y="434">git remotes</text>
  <text class="t" x="520" y="456">shallow clone / fetch of registered repos</text>
  <text class="label" x="520" y="474">cached under REPO_CACHE_DIR</text>

  <!-- edges -->
  <!-- Web UI <-> API -->
  <path class="edge" d="M230 172 L230 232" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text class="label" x="238" y="206">HTTP / SSE</text>

  <!-- API -> Postgres -->
  <path class="edge" d="M230 412 L230 472" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text class="label" x="238" y="446">SQL</text>

  <!-- API -> LLM providers -->
  <path class="edge" d="M420 300 L500 300" marker-end="url(#arrow)"/>
  <text class="label" x="430" y="293">summarize</text>

  <!-- scheduler -> git remotes -->
  <path class="edge" d="M420 372 L470 372 L470 440 L500 440" marker-end="url(#arrow)"/>
  <text class="label" x="430" y="365">ingest</text>

  <!-- CLI -> LLM providers -->
  <path class="edge" d="M620 200 L620 262" marker-end="url(#arrow)"/>
  <text class="label" x="628" y="236">--summarize</text>

  <!-- CLI -> API (registered) -->
  <path class="edge" d="M500 150 L460 150 L460 270 L420 270" marker-end="url(#arrow)"/>
  <text class="label" x="430" y="142">--registered</text>
</svg>
