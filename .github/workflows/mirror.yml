name: mirror

# Codeberg.org has pull mirrors disabled instance-wide ("Pull mirrors have
# been disabled by your site administrator"), so the Codeberg copy is kept
# in sync by pushing from here on every push. Needs CODEBERG_MIRROR_TOKEN
# (a Codeberg access token with repository write scope) in repo secrets;
# until it is configured the job no-ops with a notice.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch: # manual re-sync (e.g. after a failed run or secret rotation)

permissions:
  contents: read

concurrency:
  # Every run is a full idempotent refsync, so bursts coalesce safely: the
  # surviving run pushes everything. Without this, a merge push and its tag
  # push seconds apart race on the Codeberg side and one run fails with
  # "cannot lock ref ... incorrect old value provided".
  group: mirror
  cancel-in-progress: true

jobs:
  codeberg:
    name: Push mirror to Codeberg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every branch and tag, not just the pushed ref

      - name: Push refs to Codeberg
        env:
          TOKEN: ${{ secrets.CODEBERG_MIRROR_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CODEBERG_MIRROR_TOKEN is not configured - add it in repo secrets (Settings > Secrets and variables > Actions) to enable the Codeberg mirror."
            exit 0
          fi
          # Drop the symbolic refs/remotes/origin/HEAD so the wildcard refspec
          # below can't try to create an invalid refs/heads/HEAD on the remote.
          git remote set-head origin -d || true
          # --force: GitHub is canonical and rebases/force-pushes happen here
          # (feature branches). A fast-forward-only push would fail forever
          # on any ref whose history was rewritten — the mirror must reflect
          # the canonical repo, not merge with it.
          # The Codeberg owner is "ncolman" (n-c-o-l-e-m-a-n; the GitHub
          # owner is "nicoleman0"). This exact path was typo'd twice before.
          git push --prune --force \
            "https://ncoleman:${TOKEN}@codeberg.org/ncoleman/surgite.git" \
            "refs/remotes/origin/*:refs/heads/*" \
            "refs/tags/*:refs/tags/*"
