name: CI

# GitHub is the canonical repo; the Forgejo and Codeberg copies are read-only
# mirrors.
#
# Only main on push. A pull request branch is already covered by the
# pull_request event, and listing both ran every job twice against the same
# commit. The tradeoff: a branch pushed without an open PR gets no CI.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# One job per concern, so a failure in one still reports the others. These
# were a single `quality` job until a PR with three ruff errors reported
# nothing about its tests: the job stopped at the first red step, and the
# contributor had to fix lint before learning whether the code worked.
jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # A stale lockfile makes every other job's dependency set a guess, so it
      # is checked here rather than repeated in each one.
      - name: Check uv.lock is up to date
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      # Mypy shares this job with ruff deliberately: both are static analysis
      # over the same synced env, and a ruff failure is a one-command fix. If
      # that stops being true, lift this into its own `types` job.
      - name: Mypy
        run: uv run mypy surgite/

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Pytest
        run: uv run pytest -q

  # Separate because it fails on the calendar, not on the diff: a new advisory
  # against a pinned dependency turns this red with no code change. That should
  # not also hide the test results.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies
        run: uv sync --group dev

      - name: pip-audit
        run: uv export --no-dev --no-hashes --no-emit-project | uv run pip-audit -r /dev/stdin

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Node dependencies
        run: cd frontend && npm ci

      - name: Type-check (svelte-check)
        run: cd frontend && npm run check

      - name: Unit tests (vitest)
        run: cd frontend && npm run test

      - name: Build SvelteKit SPA
        run: cd frontend && npm run build

  snapshot:
    name: OpenAPI snapshot gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install task
        # `task` runs the Taskfile recipes; installed via `uv tool` because the
        # runner's system Python is PEP 668-locked and has no Go toolchain.
        run: uv tool install go-task-bin

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Diff against committed baseline
        # `openapi-snapshot-check` regenerates the dump and `diff -u`s it
        # against docs/openapi.json. Exit 1 on drift. On drift, the remediation
        # below shows next-steps inline in the failure log.
        run: |
          if ! task openapi-snapshot-check; then
            echo ""
            echo "::error::OpenAPI snapshot drift detected. The API surface changed since docs/openapi.json was last updated."
            echo ""
            echo "API surface changed. Review the diff above and, if the change is intentional:"
            echo ""
            echo "  1. Run 'task openapi-snapshot' to regenerate the baseline."
            echo "  2. Commit the updated docs/openapi.json to this branch."
            echo "  3. Push - the workflow will re-run and pass."
            echo ""
            echo "If the change is unintentional, fix the route / schema / model and push again. See docs/api-stability.md for the stability policy this gate enforces."
            exit 1
          fi
