[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[project]
name = "standup-gen"
version = "0.2.0"
description = "Git commit history summarizer with AI."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.49",
    "alembic>=1.18.4",
    "psycopg2-binary>=2.9.12",
    "fastapi>=0.136.1",
    "uvicorn>=0.47.0",
    "requests>=2.34.2",
]

[project.scripts]
standup = "backend.standup:main"

[tool.uv.build-backend]
module-name = "backend"
module-root = ""

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pip-audit>=2.9.0",
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# Defaults (E4/E7/E9, F) plus import sorting (I), pyupgrade (UP), and bugbear (B).
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# conftest deliberately sets env vars before importing backend modules, so its
# imports can't sit at the top of the file.
"tests/conftest.py" = ["E402"]
