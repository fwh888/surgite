[project]
name = "standup-gen"
version = "0.1.0"
description = "Git commit history summarizer with AI."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "groq>=1.2.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.49",
    "alembic>=1.18.4",
]

[project.scripts]
standup = "standup.standup:main"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pip-audit>=2.9.0",
]
