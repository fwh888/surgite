[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[project]
name = "standup-gen"
version = "0.4.0"
description = "Git commit history summarizer with AI."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.49",
    "alembic>=1.18.4",
    "psycopg2-binary>=2.9.12",
    "fastapi>=0.136.1",
    "uvicorn>=0.47.0",
    "httpx>=0.27.0",
    "argon2-cffi>=23.1.0",
]

[project.scripts]
standup = "backend.standup:main"

[tool.uv.build-backend]
module-name = "backend"
module-root = ""

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pip-audit>=2.9.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    # httpx2 is the successor to httpx, used by starlette's TestClient.
    # Runtime code (backend/) keeps using httpx; only the test client
    # migrates to httpx2 to clear the StarletteDeprecationWarning that
    # landed in starlette 1.3.x.
    "httpx2>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Async summarizer unit tests are plain `async def`; auto mode runs them
# without a per-test marker. The TestClient drives the async API endpoints
# synchronously, so those tests stay sync.
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# Defaults (E4/E7/E9, F) plus import sorting (I), pyupgrade (UP), and bugbear (B).
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# conftest deliberately sets env vars before importing backend modules, so its
# imports can't sit at the top of the file.
"tests/conftest.py" = ["E402"]
# Depends() in argument defaults is the standard FastAPI pattern.
"backend/api.py" = ["B008"]
"backend/auth.py" = ["B008"]
