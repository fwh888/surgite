name: CI

on:
  pull_request:

jobs:
  typecheck:
    name: Type check (mypy)
    runs-on: host
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run mypy
        run: uv run mypy backend/

  lint:
    name: Lint & format (ruff)
    runs-on: host
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run ruff (lint)
        run: uv run ruff check .

      - name: Run ruff (format check)
        run: uv run ruff format --check .

  lockfile:
    name: Lock file drift
    runs-on: host
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check uv.lock is up to date
        run: uv lock --check

  audit:
    name: Dependency audit (pip-audit)
    runs-on: host
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run pip-audit
        run: uv export --no-dev --no-hashes --no-emit-project | uv run pip-audit -r /dev/stdin

  test:
    name: Tests (pytest)
    runs-on: host
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run pytest
        run: uv run pytest -q

  frontend:
    name: Frontend build
    runs-on: host
    steps:
      - uses: actions/checkout@v4

      - name: Install Node dependencies
        run: cd frontend && npm ci

      - name: Type-check (svelte-check)
        run: cd frontend && npm run check

      - name: Unit tests (vitest)
        run: cd frontend && npm run test

      - name: Build SvelteKit SPA
        run: cd frontend && npm run build
