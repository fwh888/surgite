name: CI

on:
  pull_request:

jobs:
  typecheck:
    name: Type check (mypy)
    runs-on: host
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run mypy
        run: uv run mypy standup/

  lockfile:
    name: Lock file drift
    runs-on: host
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check uv.lock is up to date
        run: uv lock --check

  audit:
    name: Dependency audit (pip-audit)
    runs-on: host
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run pip-audit
        run: uv export --no-dev --no-hashes --no-emit-project | uv run pip-audit -r /dev/stdin

  test:
    name: Tests (pytest)
    runs-on: host
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run pytest
        run: uv run pytest -q
