name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (lint, types, audit, tests)
    runs-on: host
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check uv.lock is up to date
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy surgite/

      - name: pip-audit
        run: uv export --no-dev --no-hashes --no-emit-project | uv run pip-audit -r /dev/stdin

      - name: Pytest
        run: uv run pytest -q

  frontend:
    name: Frontend build
    runs-on: host
    steps:
      - uses: actions/checkout@v4

      - name: Install Node dependencies
        run: cd frontend && npm ci

      - name: Type-check (svelte-check)
        run: cd frontend && npm run check

      - name: Unit tests (vitest)
        run: cd frontend && npm run test

      - name: Build SvelteKit SPA
        run: cd frontend && npm run build
