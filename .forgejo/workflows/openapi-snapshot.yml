name: OpenAPI snapshot

on:
  pull_request:

jobs:
  openapi-snapshot:
    name: OpenAPI snapshot gate
    runs-on: host
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install task
        # `task` is the Taskfile runner used by the snapshot workflow.
        # See Taskfile.yml for the task definitions. We install via
        # `uv tool install` (rather than `pip install` or `go install`)
        # because the host runner's system Python is PEP 668-locked
        # and doesn't have a Go toolchain; `uv tool install` creates
        # an isolated tool venv at `~/.local/share/uv/tools/...` and
        # symlinks the binary into `~/.local/bin/task`, which is on
        # the runner's PATH.
        run: uv tool install go-task-bin

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Diff against committed baseline
        # The `openapi-snapshot-check` task regenerates the dump to a
        # project-scoped temp path and `diff -u`s it against
        # docs/openapi.json. Exit 1 on drift; exit 0 on match.
        #
        # On drift, the task prints the diff to the workflow log; the
        # block below echoes a remediation message so the developer
        # sees next-steps inline in the failure log without having to
        # read the diff itself to figure out what to do.
        run: |
          if ! task openapi-snapshot-check; then
            echo ""
            echo "::error::OpenAPI snapshot drift detected. The API surface changed since docs/openapi.json was last updated."
            echo ""
            echo "API surface changed. Review the diff above and, if the change is intentional:"
            echo ""
            echo "  1. Run 'task openapi-snapshot' to regenerate the baseline."
            echo "  2. Commit the updated docs/openapi.json to this branch."
            echo "  3. Push - the workflow will re-run and pass."
            echo ""
            echo "If the change is unintentional, fix the route / schema / model and push again. See docs/0.6.0-plan.md slice 1 for the stability policy this gate enforces."
            exit 1
          fi
