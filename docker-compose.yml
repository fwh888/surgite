services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-standup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-standup}
      POSTGRES_DB: ${POSTGRES_DB:-standup}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-standup}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    # Builds from source by default (`docker compose up --build`). A pre-built
    # registry image can be used instead by setting APP_IMAGE (see .env.example).
    build: .
    image: ${APP_IMAGE:-standup-gen-app:latest}
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-standup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-standup}
      POSTGRES_DB: ${POSTGRES_DB:-standup}
      GIT_SSL_NO_VERIFY: "1"
      REPO_CACHE_DIR: /var/standup/repos
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      STANDUP_USER: ${STANDUP_USER:-}
      STANDUP_ROLE: ${STANDUP_ROLE:-}
      API_HOST: 0.0.0.0
      API_PORT: 8000
    volumes:
      - standup-repos:/var/standup/repos
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  standup-repos: